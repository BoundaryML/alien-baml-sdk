[project]
name = "alien-sdk"
version = "0.0.0"
description = "Alien SDK for Python, generated from one BAML project (reference implementation)"
requires-python = ">=3.10"
dependencies = [
    "baml-bridge==0.23.0",
    "pydantic>=2.6",
    "typing-extensions>=4.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8"]

[tool.uv]
package = false

# `uv pip install sdk/python` (or pip) builds a wheel of the facade and the
# generated package; baml_sdk/ and alien_sdk/_operations.py (genops.py) are
# gitignored, so they are listed as artifacts.
[tool.hatch.build.targets.wheel]
packages = ["alien_sdk", "baml_sdk"]
artifacts = ["baml_sdk/", "alien_sdk/_operations.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
