# Standalone package. Neither install script below is needed: esbuild ships
# per-platform binaries as optional dependencies, and protobufjs's script only
# prints a notice.
# scripts/generate.sh installs, then links a local BAML build's bridge over the
# installed one; pnpm must not reinstall before `pnpm test` and undo that.
verifyDepsBeforeRun: false
allowBuilds:
  esbuild: false
  protobufjs: false
